name: Bug report
description: Report a defect in tai42-mcp-dynamic-postgres (schema-driven PostgreSQL MCP tool generator)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps that reproduce the problem — the schema/DDL of the affected table(s), the CLI flags used, and the generated tool call. Do NOT include real credentials.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai42-mcp-dynamic-postgres version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, PostgreSQL server version, and whether pgvector is enabled.
      placeholder: "Python 3.13.x, macOS 15, PostgreSQL 16, pgvector 0.7"
    validations:
      required: true
