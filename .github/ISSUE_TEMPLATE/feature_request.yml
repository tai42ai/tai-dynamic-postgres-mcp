name: Feature request
description: Propose an addition or change to tai-dynamic-postgres-mcp
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added or changed, and what problem does it solve? Remember the ground rule — the server only ever emits scoped, injection-safe tools (bound values, whitelisted quoted identifiers, no raw SQL surface).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai-dynamic-postgres-mcp version
      description: The version you are using, if relevant.
      placeholder: "0.1.0"
    validations:
      required: false
